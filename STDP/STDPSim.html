<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding and browser compatibility -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <!-- Page title shown in browser tab -->
    <title>Spike-Timing Dependent Plasticity Simulation</title>

    <!-- Link to stylesheet -->
    <link rel="stylesheet" href="./styles.css">

    <!-- Load Plotly graphing library from CDN -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>

    <!-- Header section with title, subtitle, and tab buttons -->
    <div class="header">
        <h1>STDP Simulations</h1>
        <p class="subtitle">Reproduction of Song et al. Figures</p>
        <p class="version">Ver. 2.0.0</p>

        <!-- Tab buttons to switch between Figure 1 and Figure 4 -->
        <div class="tab-container">
            <button class="tab-button active" data-tab="figure1">Figure 1 (Neuron 2001)</button>
            <button class="tab-button" data-tab="figure4">Figure 4 (NatNeuro 2000)</button>
        </div>
    </div>

    <!-- ==================== Figure 1 Tab ==================== -->
    <div id="figure1" class="tab-content active">
    <div class="main-container">

        <!-- Left panel - parameter controls for Figure 1 -->
        <div class="left-panel">

            <!-- Reset parameters button -->
            <div class="section">
                <button id="resetParams" class="sim-button" style="width: 100%; margin-bottom: 15px;">Reset Parameters</button>
            </div>

            <!-- STDP parameters -->
            <div class="section">
                <h2>STDP Parameters</h2>
                <div class="param-row">
                    <label><em>B</em> (LTD/LTP ratio):</label>
                    <input type="number" id="B" value="1.05" min="0.1" max="3" step="0.01">
                </div>
            </div>

            <!-- Network parameters -->
            <div class="section">
                <h2>Network Parameters</h2>
                <div class="param-row">
                    <label>Simulation time:</label>
                    <input type="number" id="stime" value="500000" min="100000" max="2000000" step="100000">
                </div>
                <div class="param-row">
                    <label>Correlation time (ms):</label>
                    <input type="number" id="corr_time" value="20" min="5" max="100">
                </div>
                <div class="param-row">
                    <label>Correlation strength (<em>yConst</em>):</label>
                    <input type="number" id="yConst" value="2" min="1" max="20">
                </div>
            </div>

            <!-- Simulation control - run buttons, stop button, and progress bar -->
            <div class="section">
                <h2>Simulation Control</h2>
                <div class="control-buttons">
                    <!-- Three conditions matching the three panels in the paper -->
                    <button id="runCondition1" class="sim-button">Uncorrelated ↔ Uncorrelated</button>
                    <button id="runCondition2" class="sim-button">Correlated ↔ Uncorrelated</button>
                    <button id="runCondition3" class="sim-button">Correlated ↔ Correlated</button>
                    <button id="stopSimulation" class="sim-button stop-button">Stop Simulation</button>
                </div>

                <!-- Progress bar and status text -->
                <div class="status-area">
                    <div class="progress-container">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                    <div class="status" id="status">Ready</div>
                </div>
            </div>
        </div>

        <!-- Right panel - 2x2 plot grid for Figure 1 -->
        <div class="right-panel">
            <div class="plot-grid">
                <div class="plot-item">
                    <div id="condition1Chart" class="plots"></div> <!-- Uncorrelated vs Uncorrelated -->
                </div>
                <div class="plot-item">
                    <div id="condition2Chart" class="plots"></div> <!-- Correlated vs Uncorrelated -->
                </div>
                <div class="plot-item">
                    <div id="condition3Chart" class="plots"></div> <!-- Correlated vs Correlated -->
                </div>
                <div class="plot-item">
                    <div id="histogramChart" class="plots"></div> <!-- Weight distribution histogram -->
                </div>
            </div>
        </div>
    </div>
    </div>

    <!-- ==================== Figure 4 Tab ==================== -->
    <div id="figure4" class="tab-content">
    <div class="main-container">

        <!-- Left panel - parameter controls for Figure 4 -->
        <div class="left-panel">

            <!-- Reset parameters button -->
            <div class="section">
                <button id="resetParamsF4" class="sim-button" style="width: 100%; margin-bottom: 15px;">Reset Parameters</button>
            </div>

            <!-- Synaptic parameters -->
            <div class="section">
                <h2>Synaptic Parameters</h2>
                <div class="param-row">
                    <label><em>g</em><sub>initial</sub> (Initial conductance):</label>
                    <input type="number" id="f4_g_init" value="0.003" min="0.001" max="0.05" step="0.001">
                </div>
                <div class="param-row">
                    <label><em>g</em><sub>max</sub>:</label>
                    <input type="number" id="f4_gmax" value="0.015" min="0.001" max="0.1" step="0.001">
                </div>
            </div>

            <!-- Simulation parameters -->
            <div class="section">
                <h2>Simulation Parameters</h2>
                <div class="param-row">
                    <label>Iterations:</label>
                    <input type="number" id="f4_ttimes" value="2000" min="100" max="5000" step="100">
                </div>
                <div class="param-row">
                    <label>Latency jitter (std dev, ms):</label>
                    <input type="number" id="f4_latency_std" value="15" min="1" max="50">
                </div>
                <div class="param-row">
                    <label>Burst rate (Hz):</label>
                    <input type="number" id="f4_burstrate" value="100" min="10" max="500">
                </div>
            </div>

            <!-- Simulation control - run/stop buttons and progress bar -->
            <div class="section">
                <h2>Simulation Control</h2>
                <div class="control-buttons">
                    <button id="runFigure4" class="sim-button">Run Simulation</button>
                    <button id="stopFigure4" class="sim-button stop-button">Stop</button>
                </div>

                <!-- Progress bar and status text -->
                <div class="status-area">
                    <div class="progress-container">
                        <div class="progress-bar" id="f4_progressBar"></div>
                    </div>
                    <div class="status" id="f4_status">Ready</div>
                </div>
            </div>
        </div>

        <!-- Right panel - 2x2 plot grid for Figure 4 -->
        <div class="right-panel">
            <div class="plot-grid-2x2">
                <div class="plot-item">
                    <div id="f4_initialWeights" class="plots"></div> <!-- Initial weight distribution -->
                </div>
                <div class="plot-item">
                    <div id="f4_initialVoltage" class="plots"></div> <!-- Initial voltage trace -->
                </div>
                <div class="plot-item">
                    <div id="f4_currentWeights" class="plots"></div> <!-- Current weight distribution -->
                </div>
                <div class="plot-item">
                    <div id="f4_currentVoltage" class="plots"></div> <!-- Current voltage trace -->
                </div>
            </div>
        </div>
    </div>
    </div>

<!-- Footer -->
<div class="footer">
    STDP Simulation Ver. 2.0.0
</div>

<!-- Load the simulation JavaScript file (?v=7 forces browser to use latest version) -->
<script src="./STDP_simulation_ver_2.0.0.js?v=8"></script>

</body>
</html>
